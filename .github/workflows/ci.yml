name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  # A "Run workflow" button on the repository's Actions tab.
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: Plays in Chromium
    # Only once the quick checks pass: no point playing videos with a broken build.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The test videos are made once and kept until scripts/fixtures.sh changes, so ffmpeg is
      # only installed (and the videos only encoded) on the first run after a change.
      - name: Restore the test videos
        id: media
        uses: actions/cache@v4
        with:
          path: examples/basic/media
          key: media-${{ hashFiles('scripts/fixtures.sh') }}
      - name: Make the test videos
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm run fixtures

      # Chromium is kept between runs too; only the system libraries it needs are installed.
      - name: Restore Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
