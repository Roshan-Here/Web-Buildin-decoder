<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web-Buildin-decoder example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
        background: #0f1115;
        color: #e8e8ea;
      }
      .stage {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }
      .captions {
        position: absolute;
        inset: auto 0 6% 0;
        text-align: center;
        white-space: pre-line;
        font-size: clamp(14px, 2.6vw, 26px);
        text-shadow:
          0 0 4px #000,
          0 0 2px #000;
        pointer-events: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 12px 0;
      }
      input[type='range'] {
        flex: 1;
      }
      input[type='url'] {
        flex: 1;
        min-width: 200px;
      }
      #status {
        color: #9aa0a6;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Web-Buildin-decoder</h1>
    <div class="row">
      <input id="file" type="file" accept="video/*,.mkv,.avi,.ts" />
      <input
        id="url"
        type="url"
        placeholder="…or a video URL (server must accept Range requests)"
      />
      <button id="open">Open URL</button>
    </div>
    <div class="stage" id="stage"><div class="captions" id="captions"></div></div>
    <div class="row">
      <button id="play" disabled>Play</button>
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" disabled />
      <span id="time">0:00 / 0:00</span>
    </div>
    <div class="row">
      <label
        >Audio
        <select id="audio"></select
      ></label>
      <label
        >Subtitles
        <select id="subtitles"></select
      ></label>
    </div>
    <p id="status">Choose a file to start.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
